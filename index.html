<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sedang Dalam Pengerjaan 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brown-text: #5C3D2E;
      --brown-dark: #432B1D;
      --brown-btn: #674730;
      --bg-warm: #FDEED9;
      --accent-pink: #E58C8A;
      --accent-yellow: #F6C85F;
      --capy-main: #B88659;
      --capy-dark: #9E6F45;
      --capy-line: #422817;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #ECE5DC;
      color: var(--brown-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }

    /* Container Utama */
    .dev-container {
      width: 100%;
      max-width: 540px;
      background: radial-gradient(circle at 50% 30%, #FFF8EE 0%, var(--bg-warm) 100%);
      border-radius: 32px;
      border: 8px solid #FFFDF9;
      box-shadow: 0 20px 50px rgba(92, 61, 46, 0.12);
      padding: 50px 32px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Badge Status */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(246, 200, 95, 0.25);
      border: 1.5px solid var(--accent-yellow);
      color: #7A561D;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #E2A01C;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* Teks Judul & Deskripsi */
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.3rem);
      font-weight: 800;
      color: var(--brown-text);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: #7D5A44;
      line-height: 1.6;
      max-width: 400px;
      margin: 0 auto 10px;
    }

    /* Ilustrasi SVG */
    .art-container {
      width: 100%;
      max-width: 270px;
      height: 230px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0 15px;
      filter: drop-shadow(0 10px 15px rgba(80, 55, 35, 0.12));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Progress Bar */
    .progress-section {
      width: 100%;
      max-width: 340px;
      margin: 10px 0 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: #8C664C;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #EFE0D0;
      border-radius: 999px;
      overflow: hidden;
      padding: 2px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 68%;
      background: linear-gradient(90deg, #E58C8A, #F6C85F);
      border-radius: 999px;
      animation: progressAnim 2s ease-out;
    }

    @keyframes progressAnim {
      from { width: 0%; }
      to { width: 68%; }
    }

    /* Footer Note */
    .footer-note {
      font-size: 0.85rem;
      font-weight: 700;
      color: #9C7862;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    .heart-icon {
      color: var(--accent-pink);
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="dev-container">
    
    <div class="status-badge">
      <div class="pulse-dot"></div>
      Sedang Tahap Pengembangan
    </div>

    <h1>Sabar ya, lagi disiapin!</h1>
    <p class="subtitle">
      Halaman ini sedang dalam proses pengerjaan supaya hasilnya lebih maksimal dan nyaman buat kamu.
    </p>

    <div class="art-container">
      <svg viewBox="0 0 240 220" width="100%" height="100%">
        <ellipse cx="120" cy="195" rx="80" ry="14" fill="#E2CFBA" opacity="0.6"/>

        <ellipse cx="120" cy="135" rx="65" ry="50" fill="var(--capy-main)" />
        
        <path d="M 60,65 C 30,85 35,125 65,128 C 88,128 105,115 105,85 C 105,60 85,55 60,65 Z" fill="var(--capy-main)" />
        
        <path d="M 45,85 C 32,95 38,120 58,122 C 72,122 80,108 80,85 Z" fill="var(--capy-dark)" />
        
        <path d="M 72,82 Q 78,76 84,82" stroke="var(--capy-line)" stroke-width="3" fill="none" stroke-linecap="round"/>
        
        <ellipse cx="50" cy="98" rx="3" ry="5" fill="var(--capy-line)" />
        <line x1="50" y1="103" x2="50" y2="112" stroke="var(--capy-line)" stroke-width="2" stroke-linecap="round"/>

        <circle cx="108" cy="65" r="7" fill="var(--capy-dark)" />

        <path d="M 80,140 Q 75,175 90,175" stroke="var(--capy-dark)" stroke-width="12" stroke-linecap="round" fill="none"/>
        <path d="M 130,145 Q 135,175 145,172" stroke="var(--capy-dark)" stroke-width="12" stroke-linecap="round" fill="none"/>

        <g transform="translate(62, 28)">
          <path d="M 0,28 C 0,8 48,8 48,28 Z" fill="#F6C85F" />
          <path d="M -6,28 Q 24,24 54,28" stroke="#E2A01C" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M 10,18 Q 20,12 32,14" stroke="#FFF7D6" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <span>Progress Pengerjaan</span>
        <span>68%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

  </div>

</body>
</html>
