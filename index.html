<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Development</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #121316;
      --panel-bg: #1A1B20;
      --panel-border: #282A32;
      --accent-yellow: #F5A623;
      --text-main: #E6E8EC;
      --text-muted: #8E929E;
      --code-bg: #111215;
      
      --capy-main: #B88659;
      --capy-dark: #9E6F45;
      --capy-line: #422817;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      /* Grid pattern ala blueprint engineering */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Container Panel */
    .eng-panel {
      width: 100%;
      max-width: 580px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* Top Strip / Status Header */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(245, 166, 35, 0.1);
      border: 1px solid rgba(245, 166, 35, 0.3);
      color: var(--accent-yellow);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .status-indicator {
      width: 7px;
      height: 7px;
      background-color: var(--accent-yellow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-yellow);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Typography */
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    p.desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 420px;
      margin-bottom: 20px;
    }

    /* Mascot SVG */
    .art-container {
      width: 100%;
      max-width: 220px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0 20px;
    }

    /* Terminal / System Logs Box */
    .console-box {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      text-align: left;
      margin-bottom: 24px;
    }

    .log-line {
      display: flex;
      gap: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .log-line:last-child {
      margin-bottom: 0;
    }

    .log-line .tag {
      color: var(--accent-yellow);
    }

    .log-line.active {
      color: var(--text-main);
    }

    /* Progress Bar */
    .progress-wrapper {
      width: 100%;
      margin-bottom: 12px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--panel-border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      width: 72%;
      height: 100%;
      background: var(--accent-yellow);
      border-radius: 99px;
    }

    /* Engineering Footer Details */
    .footer-spec {
      width: 100%;
      border-top: 1px solid var(--panel-border);
      padding-top: 16px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #5
