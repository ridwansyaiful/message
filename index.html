<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hei, kamu.</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');

:root {
    --brown: #5c3c28;
    --brown-dark: #432b1d;
    --brown-btn: #674730;
    --pink-heart: #e3827f;
    --capy-main: #b88659;
    --capy-dark: #9e6f45;
    --capy-shadow: #835733;
    --line-color: #422817;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #eadecd;
    color: var(--brown);
    font-family: 'Nunito', sans-serif;
    user-select: none;
}

/* =========================
   SECTION & PANELS
========================= */
section {
    min-height: 100vh;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.panel {
    width: min(1000px, 100%);
    min-height: 640px;
    height: 90vh;
    max-height: 720px;
    border-radius: 36px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    border: 8px solid #fffdfa;
    box-shadow: 0 20px 50px rgba(92, 60, 40, 0.12);
}

/* =========================
   BACKGROUND THEMES
========================= */
.one {
    background: radial-gradient(circle at 75% 50%, #fff8eb 0%, #fbe8cb 100%);
}

.two {
    background: radial-gradient(circle at 25% 50%, #fff6ea 0%, #f9e3c7 100%);
}

.three {
    background: linear-gradient(135deg, #fde4d8 0%, #fcd6c6 50%, #f8e5d8 100%);
}

.four {
    background: linear-gradient(180deg, #d3b4d4 0%, #f4c2b2 45%, #f6e2b8 75%, #8ba671 100%);
}

/* =========================
   CONTENT & TYPOGRAPHY
========================= */
.content {
    position: relative;
    z-index: 5;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.content-left {
    width: 50%;
    margin-left: 5%;
}

.content-right {
    width: 50%;
    margin-left: auto;
    margin-right: 5%;
}

.content-center {
    width: 100%;
    margin-top: -60px;
}

h1 {
    font-size: clamp(40px, 5.5vw, 68px);
    font-weight: 800;
    line-height: 1.1;
    margin: 6px 0 12px;
    letter-spacing: -1px;
}

h2 {
    font-size: clamp(30px, 4vw, 50px);
    font-weight: 800;
    line-height: 1.15;
    margin: 6px 0 10px;
}

p.desc {
    font-size: clamp(17px, 2vw, 22px);
    font-weight: 600;
    opacity: 0.85;
    margin: 4px 0 16px;
}

.heart-top {
    font-size: 26px;
    color: var(--pink-heart);
    margin-bottom: 4px;
    animation: heartPulse 1.8s infinite ease-in-out;
}

.divider {
    color: #9d7b62;
    font-size: 14px;
    margin: 8px 0 14px;
    letter-spacing: 4px;
    opacity: 0.7;
}

@keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
}

/* =========================
   STICKY NOTE (PANEL 3)
========================= */
.sticky-card {
    background: #fffdf7;
    border-radius: 14px;
    padding: 34px 28px;
    width: min(340px, 100%);
    box-shadow: 0 12px 30px rgba(100, 60, 30, 0.1);
    position: relative;
    border: 1px solid rgba(220, 195, 170, 0.6);
    transform: rotate(-1.5deg);
    margin-bottom: 12px;
}

.washi-tape {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 85px;
    height: 20px;
    background: rgba(227, 130, 127, 0.45);
    border-radius: 2px;
}

.sticky-title {
    color: #df7065;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
}

.sticky-text {
    font-size: 16px;
    line-height: 1.6;
    font-weight: 600;
    color: #63432f;
}

/* =========================
   BUTTONS
========================= */
.btn-action {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    border: 0;
    background: var(--brown-btn);
    color: #ffffff;
    padding: 13px 34px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(84, 50, 30, 0.22);
    transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
}

.btn-action:hover {
    transform: translateY(-3px);
    background: var(--brown-dark);
    box-shadow: 0 12px 26px rgba(84, 50, 30, 0.3);
}

.btn-action:active {
    transform: scale(0.97);
}

.btn-pill {
    background: rgba(255, 255, 255, 0.85);
    color: #5a3a24;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(70, 40, 20, 0.15);
    transition: transform 0.2s, background 0.2s;
}

.btn-pill:hover {
    background: #ffffff;
    transform: translateY(-2px);
}

/* =========================
   CAPYBARA & ART POSITIONING
========================= */
.capy-art {
    position: absolute;
    z-index: 3;
    filter: drop-shadow(0 14px 14px rgba(70, 45, 25, 0.12));
    animation: gentleFloat 4.5s ease-in-out infinite;
}

.pos-one {
    right: 6%;
    bottom: 8%;
    width: min(420px, 45vw);
}

.pos-two {
    left: 4%;
    bottom: 12%;
    width: min(460px, 46vw);
    animation-delay: 0.4s;
}

.pos-three {
    right: 5%;
    bottom: 8%;
    width: min(430px, 45vw);
    animation-delay: 0.8s;
}

.pos-four {
    right: 4%;
    bottom: 10%;
    width: min(500px, 52vw);
    animation-delay: 1.2s;
}

@keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* Foliage & Deco */
.deco-leaf {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
}

.leaf-top-left {
    top: -20px;
    left: -20px;
    width: 170px;
}

.leaf-top-right {
    top: -15px;
    right: -15px;
    width: 160px;
}

/* =========================
   FOOTER
========================= */
.footer-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #503423;
    color: #edd9cc;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.5px;
    z-index: 8;
}

/* =========================
   RESPONSIVE / MOBILE
========================= */
@media (max-width: 820px) {
    .panel {
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 50px;
        min-height: 680px;
        height: auto;
    }

    .content-left, .content-right {
        width: 90%;
        margin: 0 auto;
        padding: 15px;
    }

    .pos-one {
        position: relative;
        right: auto;
        bottom: auto;
        width: 250px;
        margin-top: 10px;
    }

    .pos-two {
        position: relative;
        left: auto;
        bottom: auto;
        width: 270px;
        order: 2;
    }

    .content-right {
        order: 1;
    }

    .pos-three {
        position: relative;
        right: auto;
        bottom: auto;
        width: 220px;
    }

    .pos-four {
        position: relative;
        right: auto;
        bottom: auto;
        width: 290px;
        margin-top: 15px;
    }

    .content-center {
        margin-top: 0;
    }
}
</style>
</head>
<body>

<!-- ==========================================
     PAGE 1: HEI, KAMU.
========================================== -->
<section id="p1">
    <div class="panel one">
        <!-- Daun Hiasan Pojok Kiri -->
        <svg class="deco-leaf leaf-top-left" viewBox="0 0 100 100">
            <path d="M0,0 Q40,10 50,50 Q10,40 0,0 Z" fill="#9bb388"/>
            <path d="M0,20 Q30,40 30,80 Q5,60 0,20 Z" fill="#88a573"/>
            <path d="M20,0 Q60,15 80,0 Q50,30 20,0 Z" fill="#b1c89f"/>
        </svg>

        <div class="content content-left">
            <div class="heart-top">♥</div>
            <h1>Hei, kamu.</h1>
            <p class="desc">Ada sesuatu buat kamu.</p>
            <div class="divider">🌿 ✦ 🌿</div>
            <button class="btn-action" onclick="go('p2')">
                Buka &nbsp;→
            </button>
        </div>

        <!-- Capybara 1: Duduk membawa bunga mawar -->
        <div class="capy-art pos-one">
            <svg viewBox="0 0 320 320" width="100%" height="100%">
                <!-- Tekstur Bayangan Bawah -->
                <ellipse cx="160" cy="285" rx="110" ry="18" fill="#dfcaa9" opacity="0.6"/>
                
                <!-- Badan Duduk Gendut -->
                <path d="M 90,265 C 60,240 60,165 110,135 C 150,110 210,120 240,165 C 270,210 260,265 225,275 C 185,285 120,285 90,265 Z" fill="var(--capy-main)"/>
                <!-- Tekstur shading punggung -->
                <path d="M 210,140 C 255,185 260,245 225,275 C 205,280 180,280 180,280 C 235,250 240,180 200,145 Z" fill="var(--capy-dark)" opacity="0.35"/>

                <!-- Kepala Balok Khas (Menghadap Kiri) -->
                <path d="M 130,80 C 130,65 115,55 90,60 C 65,65 55,80 55,115 C 55,145 68,160 95,160 C 120,160 145,150 145,120 C 145,95 130,95 130,80 Z" fill="var(--capy-main)"/>
                
                <!-- Moncong Coklat Tua -->
                <path d="M 55,95 C 45,105 45,135 60,150 C 75,160 95,158 95,140 C 95,120 85,95 55,95 Z" fill="var(--capy-dark)"/>
                
                <!-- Hidung Bulat Hitam -->
                <ellipse cx="56" cy="120" rx="4" ry="6" fill="var(--line-color)"/>
                <line x1="56" y1="126" x2="56" y2="138" stroke="var(--line-color)" stroke-width="2.5" stroke-linecap="round"/>
                
                <!-- Mata Merem Garis Melengkung -->
                <path d="M 85,102 Q 93,96 101,102" stroke="var(--line-color)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                
                <!-- Telinga Kecil -->
                <path d="M 130,75 C 130,65 140,65 142,75 C 142,85 132,85 130,75 Z" fill="var(--capy-dark)"/>

                <!-- Kaki Depan Memegang Bunga -->
                <path d="M 100,180 Q 90,225 110,225 Q 125,225 125,190 Z" fill="var(--capy-dark)"/>
                <path d="M 125,185 Q 120,230 140,230 Q 155,230 150,195 Z" fill="var(--capy-shadow)"/>
                
                <!-- Tangkai & Bunga Pink -->
                <line x1="85" y1="210" x2="105" y2="160" stroke="#759359" stroke-width="4" stroke-linecap="round"/>
                <circle cx="85" cy="160" r="10" fill="#f69d9d"/>
                <circle cx="75" cy="152" r="9" fill="#f8abab"/>
                <circle cx="92" cy="150" r="9" fill="#f8abab"/>
                <circle cx="83" cy="142" r="9" fill="#faa2a2"/>
                <circle cx="84" cy="153" r="5" fill="#fce4a6"/>
                
                <!-- Kaki Belakang Duduk -->
                <ellipse cx="205" cy="265" rx="30" ry="14" fill="var(--capy-dark)"/>
            </svg>
        </div>
    </div>
</section>

<!-- ==========================================
     PAGE 2: SEBENARNYA NGGAK ADA APA-APA
========================================== -->
<section id="p2">
    <div class="panel two">
        <!-- Capybara 2: Berjalan menatap kupu-kupu -->
        <div class="capy-art pos-two">
            <svg viewBox="0 0 360 280" width="100%" height="100%">
                <ellipse cx="180" cy="250" rx="130" ry="16" fill="#e5d0b3" opacity="0.6"/>

                <!-- Papan Kayu Hati di Belakang -->
                <g transform="translate(20, 140)">
                    <rect x="25" y="40" width="8" height="50" fill="#9e7551"/>
                    <rect x="0" y="10" width="55" height="36" rx="6" fill="#bfa07e" stroke="#8c6847" stroke-width="2"/>
                    <path d="M 27,24 C 27,20 22,17 19,21 C 16,17 11,20 11,24 C 11,30 19,34 19,34 C 19,34 27,30 27,24 Z" fill="#fff5ea"/>
                </g>

                <!-- Badan Horisontal (Jalan Santai) -->
                <path d="M 120,120 C 160,110 240,115 270,150 C 295,185 285,230 250,240 C 190,255 120,245 100,210 C 85,180 90,130 120,120 Z" fill="var(--capy-main)"/>
                
                <!-- Kepala Balok Moncong Tebal -->
                <path d="M 225,125 C 235,90 265,85 295,100 C 315,110 325,130 320,165 C 315,185 295,190 270,185 C 245,180 230,160 225,125 Z" fill="var(--capy-main)"/>
                <path d="M 285,115 C 305,125 320,140 318,165 C 310,185 290,185 280,180 Z" fill="var(--capy-dark)"/>

                <!-- Wajah Santai -->
                <ellipse cx="316" cy="150" rx="3.5" ry="5.5" fill="var(--line-color)"/>
                <path d="M 268,125 Q 276,118 284,124" stroke="var(--line-color)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="240" cy="100" r="7" fill="var(--capy-dark)"/>

                <!-- Kaki Melangkah -->
                <path d="M 120,220 L 110,255 L 125,255 L 138,225 Z" fill="var(--capy-dark)"/>
                <path d="M 150,225 L 160,255 L 175,255 L 168,225 Z" fill="var(--capy-shadow)"/>
                <path d="M 220,225 L 210,255 L 225,255 L 235,225 Z" fill="var(--capy-dark)"/>
                <path d="M 250,225 L 265,252 L 280,250 L 268,220 Z" fill="var(--capy-shadow)"/>

                <!-- Kupu-Kupu Kuning -->
                <g transform="translate(325, 80)">
                    <ellipse cx="0" cy="0" rx="7" ry="10" fill="#fcd367" transform="rotate(30)"/>
                    <ellipse cx="10" cy="-4" rx="6" ry="8" fill="#fbd257" transform="rotate(-20)"/>
                    <circle cx="4" cy="3" r="2.5" fill="#674730"/>
                </g>
            </svg>
        </div>

        <div class="content content-right">
            <h2>Sebenarnya<br>nggak ada apa-apa.</h2>
            <div class="heart-top">♥</div>
            <p class="desc">Aku cuma mau kasih ini.</p>
            <button class="btn-action" onclick="go('p3')">
                Lihat &nbsp;→
            </button>
        </div>
    </div>
</section>

<!-- ==========================================
     PAGE 3: SURAT STICKY NOTE & KOPI
========================================== -->
<section id="p3">
    <div class="panel three">
        <div class="content content-left" style="align-items: center;">
            <div class="sticky-card">
                <div class="washi-tape"></div>
                <div class="sticky-title">Buat kamu.</div>
                <div class="heart-top" style="font-size: 18px; margin: 4px 0;">♥</div>
                <div class="sticky-text">
                    Nggak ada alasan khusus.<br>
                    Cuma pengen kasih sesuatu kecil.<br><br>
                    <strong style="color: var(--brown);">Terima kasih sudah jadi bagian yang berarti.</strong>
                </div>
                <div class="heart-top" style="font-size: 16px; margin-top: 8px;">♥</div>
            </div>

            <button class="btn-action" onclick="go('p4')">
                Lanjut &nbsp;→
            </button>
        </div>

        <!-- Capybara 3: Minum secangkir teh/kopi hangat -->
        <div class="capy-art pos-three">
            <svg viewBox="0 0 320 320" width="100%" height="100%">
                <ellipse cx="160" cy="285" rx="100" ry="16" fill="#e2c0b0" opacity="0.6"/>

                <!-- Badan Gemuk Bersandar -->
                <path d="M 110,265 C 80,240 85,170 125,140 C 165,115 220,125 250,170 C 275,210 265,265 235,275 C 195,285 140,285 110,265 Z" fill="var(--capy-main)"/>
                
                <!-- Kepala Menghadap Cangkir -->
                <path d="M 140,85 C 140,70 125,60 100,65 C 75,70 65,85 65,120 C 65,150 80,165 105,165 C 130,165 155,150 155,120 Z" fill="var(--capy-main)"/>
                <path d="M 65,100 C 55,110 55,140 70,155 C 85,165 105,160 105,145 Z" fill="var(--capy-dark)"/>

                <!-- Ekspresi Mata Merem Menikmati -->
                <ellipse cx="66" cy="125" rx="3.5" ry="5.5" fill="var(--line-color)"/>
                <path d="M 98,105 Q 106,98 114,104" stroke="var(--line-color)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="145" cy="78" r="7" fill="var(--capy-dark)"/>

                <!-- Cangkir Kopi Lucu dengan Logo Hati -->
                <g transform="translate(60, 160)">
                    <rect x="0" y="0" width="40" height="34" rx="8" fill="#fff9f0" stroke="#d5b89f" stroke-width="2"/>
                    <!-- Gagang -->
                    <path d="M 0,8 C -10,8 -10,24 0,24" fill="none" stroke="#d5b89f" stroke-width="3"/>
                    <!-- Love di cangkir -->
                    <path d="M 20,18 C 20,15 16,13 14,16 C 12,13 8,15 8,18 C 8,22 14,26 14,26 C 14,26 20,22 20,18 Z" fill="#e78d8a"/>
                    <!-- Asap Hangat -->
                    <path d="M 12,-4 Q 16,-12 10,-18" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <path d="M 24,-4 Q 28,-12 22,-18" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
                </g>

                <!-- Tangan Memegang Cangkir -->
                <path d="M 120,180 Q 95,190 98,205 Q 115,205 135,185 Z" fill="var(--capy-dark)"/>
                <!-- Kaki Bersila -->
                <ellipse cx="205" cy="265" rx="32" ry="15" fill="var(--capy-dark)"/>
                <ellipse cx="140" cy="270" rx="28" ry="14" fill="var(--capy-shadow)"/>
            </svg>
        </div>
    </div>
</section>

<!-- ==========================================
     PAGE 4: UDAH, ITU AJA (SUNSET & JERUK)
========================================== -->
<section id="p4">
    <div class="panel four">
        <div class="content content-center">
            <h2 style="color: #4b2b18;">Udah, itu aja.</h2>
            <div class="heart-top">♥</div>
            <p class="desc" style="color: #5c3822;">Semoga kamu suka.</p>
            
            <button class="btn-pill" onclick="go('p1')">
                🐾 &nbsp; Sampai ketemu lagi! &nbsp; 🐾
            </button>
        </div>

        <!-- Capybara 4: Tidur santai dengan jeruk mandarin saat senja -->
        <div class="capy-art pos-four">
            <svg viewBox="0 0 400 240" width="100%" height="100%">
                <!-- Matahari Terbenam Lembut -->
                <circle cx="80" cy="140" r="45" fill="#fff0c7" opacity="0.85"/>
                <!-- Siluet Bukit Senja -->
                <path d="M -20,240 Q 90,140 210,180 Q 310,210 420,160 L 420,240 Z" fill="#758f5c" opacity="0.7"/>

                <!-- Tubuh Rebahan Santai -->
                <path d="M 120,170 C 140,125 280,120 320,160 C 345,185 330,220 280,225 C 200,230 110,225 85,200 C 70,185 90,175 120,170 Z" fill="var(--capy-main)"/>
                
                <!-- Kepala Nyender di Tanah -->
                <path d="M 135,160 C 135,135 110,125 80,135 C 55,145 45,170 50,195 C 55,215 80,220 115,210 C 135,205 135,175 135,160 Z" fill="var(--capy-main)"/>
                <path d="M 50,170 C 45,185 55,210 80,215 C 100,215 110,200 110,185 Z" fill="var(--capy-dark)"/>

                <!-- Hidung & Garis Tidur Nyenyak -->
                <ellipse cx="50" cy="188" rx="3.5" ry="5.5" fill="var(--line-color)"/>
                <line x1="50" y1="194" x2="50" y2="204" stroke="var(--line-color)" stroke-width="2" stroke-linecap="round"/>
                <path d="M 85,165 Q 94,158 103,164" stroke="var(--line-color)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="128" cy="145" r="7" fill="var(--capy-dark)"/>

                <!-- Kaki Depan & Belakang Terjulur Santai -->
                <ellipse cx="65" cy="215" rx="18" ry="7" fill="var(--capy-dark)"/>
                <ellipse cx="125" cy="222" rx="20" ry="8" fill="var(--capy-shadow)"/>
                <ellipse cx="305" cy="205" rx="24" ry="10" fill="var(--capy-dark)"/>

                <!-- Jeruk Mandarin & Daun Hijau di Atas Kepala -->
                <g transform="translate(100, 110)">
                    <circle cx="0" cy="10" r="14" fill="#fca128"/>
                    <!-- Highlight kilau jeruk -->
                    <circle cx="-4" cy="6" r="3.5" fill="#ffc767"/>
                    <!-- Tangkai & Daun Hijau -->
                    <path d="M 0,-1 C 8,-6 14,-2 15,3 C 9,5 3,3 0,-1 Z" fill="#588157"/>
                </g>
            </svg>
        </div>

        <div class="footer-bar">
            Dibuat dengan ♥ untuk kamu
        </div>
    </div>
</section>

<!-- ==========================================
     SCRIPT NAVIGASI
========================================== -->
<script>
function go(id) {
    const el = document.getElementById(id);
    if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
    }
}
</script>

</body>
</html>
